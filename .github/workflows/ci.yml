name: CIS validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, pdo_mysql, openssl, fileinfo
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: php -l app/Domain/Money.php
      - run: php -l app/Domain/DistribuicaoPagamento.php
      - run: php tests/domain_smoke.php
      - run: cp .env.example .env
      - run: sed -i '/^DB_DATABASE=/d' .env
      - run: touch database/database.sqlite
      - run: php artisan key:generate
      - run: php artisan migrate --force
      - run: php artisan route:list --path=api
      - name: HTTP smoke test (Laravel local)
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/cis-laravel.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/up >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/up >/dev/null || { cat /tmp/cis-laravel.log; exit 1; }
          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/auth/me)
          test "$status" = 401 || { echo "Expected auth 401, got $status"; exit 1; }

  streamlit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamlit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest
      - run: python -m py_compile app.py schema_validation.py
      - run: PYTHONPATH=. python -m pytest tests/test_schema_validation.py -q
      - run: python -m pip check
      - name: Streamlit headless startup smoke test
        run: |
          streamlit run app.py --server.port 8501 --server.headless true > /tmp/cis-streamlit.log 2>&1 &
          echo $! > /tmp/cis-streamlit.pid
          python - <<'PY'
          import time, urllib.request
          for _ in range(30):
              try:
                  with urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=2) as r:
                      if r.status == 200:
                          print('Streamlit health OK')
                          break
              except Exception:
                  time.sleep(1)
          else:
              print(open('/tmp/cis-streamlit.log').read())
              raise SystemExit('Streamlit did not start')
          PY
          kill "$(cat /tmp/cis-streamlit.pid)"
