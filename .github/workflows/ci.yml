name: CIS validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, pdo_mysql, openssl, fileinfo
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: php -l app/Domain/Money.php
      - run: php -l app/Domain/DistribuicaoPagamento.php
      - run: php tests/domain_smoke.php
      - run: cp .env.example .env
      - run: sed -i '/^DB_DATABASE=/d' .env
      - run: touch database/database.sqlite
      - run: php artisan key:generate
      - run: php artisan migrate --force
      - run: php artisan route:list --path=api
