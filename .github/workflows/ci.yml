name: CIS validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Pacote da extensão CIS WhatsApp publicado e igual ao código
        run: |
          set -euo pipefail
          z=public/cis-whatsapp-extension.zip
          test -f "$z" && unzip -tq "$z"
          test -f dist/cis-whatsapp-extension.zip
          for f in manifest.json background.js bridge.js wa.js options.html options.js icons/icon16.png icons/icon32.png icons/icon48.png icons/icon128.png; do
            cmp <(unzip -p "$z" "$f") "../extension/cis-whatsapp/$f" || { echo "Pacote desactualizado: $f. Execute bash extension/build.sh" >&2; exit 1; }
          done
          for f in background.js bridge.js wa.js options.js; do node --check "../extension/cis-whatsapp/$f"; done
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, pdo_mysql, openssl, fileinfo
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: php -l app/Domain/Money.php
      - run: php -l app/Domain/DistribuicaoPagamento.php
      - run: php tests/domain_smoke.php
      - run: php tests/client_create_smoke.php
      - run: php tests/cash_available_on_smoke.php
      - run: bash -n ../deploy/enable-client-create.sh
      - run: bash -n ../deploy/install-credit-proposals.sh
      - run: cp .env.example .env
      - run: sed -i '/^DB_DATABASE=/d' .env
      - run: touch database/database.sqlite
      - run: php artisan key:generate
      - run: php -r 'require "vendor/autoload.php"; $app=require "bootstrap/app.php"; $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap(); if (!array_key_exists("mysql_cash_setup",config("database.connections",[]))) exit(1); echo "Cash writer connection configured.\n";'
      - run: php tests/create_cash_legacy_fixture.php
      # A migração de estratégia do legado exige Contractos real, ausente na BD SQLite de CI.
      # Validar isoladamente as novas tabelas sem modificar a migração financeira do legado.
      - name: Migrate isolated CIS schema (SQLite test DB only)
        run: |
          for migration in 2026_10_22_000001_create_cis_auth_tables.php 2026_10_22_000001_create_client_drafts_table.php 2026_10_28_000001_create_clients_table.php 2026_11_14_000010_create_cis_financial_reference_tables.php 2026_11_16_000030_create_cis_cash_tables.php; do
            php artisan migrate --path="database/migrations/$migration" --force
          done
      - run: php -l app/Http/Controllers/Api/CashController.php
      - run: php -l routes/console.php
      - run: php -l database/migrations/2026_11_16_000030_create_cis_cash_tables.php
      - run: bash -n ../deploy/preflight-cash-direct-account.sh
      - run: bash -n ../deploy/rehearse-cash-migration.sh
      - run: bash -n ../deploy/install-cash-direct-account.sh
      - run: bash -n ../deploy/install-message-center.sh
      - run: bash -n ../deploy/activate-cash-account-registration.sh
      - run: bash -n ../deploy/verify-cash-account-registration.sh
      - run: bash -n ../deploy/activate-cash-openings.sh
      - run: bash -n ../deploy/verify-cash-openings.sh
      - run: bash -n ../deploy/audit-cash-readiness.sh
      - run: bash -n ../deploy/rehearse-cash-operation-key.sh
      - run: bash -n ../deploy/install-cash-operation-key.sh
      - run: bash -n ../deploy/verify-cash-operation-key.sh
      - run: bash -n ../deploy/rehearse-cash-real-posting.sh
      - run: bash -n ../deploy/prepare-cash-ledger-writer.sh
      - run: bash -n ../deploy/verify-cash-ledger-writer.sh
      - run: bash -n ../deploy/activate-cash-real-posting.sh
      - run: bash -n ../deploy/disable-cash-real-posting.sh
      - run: php -l tests/cash_real_mysql_rehearsal.php
      - run: php -l app/Http/Controllers/Api/CashController.php
      - run: php -r 'require "vendor/autoload.php"; $app=require "bootstrap/app.php"; $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap(); foreach(["mysql_cash_opening_submit","mysql_cash_opening_validate"] as $name) if(!array_key_exists($name,config("database.connections",[]))) exit(1);'

      - run: bash -n ../deploy/postflight-cash-direct-account.sh
      - run: bash -n ../deploy/inspect-cash-migration-mismatch.sh
      - run: php -l app/Http/Middleware/CisThrottle.php && php tests/throttle_smoke.php
      - run: php tests/cash_smoke.php
      - run: php tests/cash_opening_preview_smoke.php
      - run: php tests/cash_operation_preview_smoke.php
      - run: php artisan migrate --path=database/migrations/2026_11_17_000050_add_operation_key_to_extracto.php --force
      - run: php tests/cash_operation_key_smoke.php
      - run: php artisan migrate --path=database/migrations/2026_11_17_000060_create_cis_cash_daily_closures.php --force
      - run: php -l database/migrations/2026_11_17_000060_create_cis_cash_daily_closures.php
      - run: php -l app/Http/Controllers/Api/CashClosureController.php
      - run: php tests/cash_daily_closure_smoke.php
      - run: php -l tests/cash_daily_closure_mysql_rehearsal.php
      - run: bash -n ../deploy/rehearse-cash-daily-closures.sh
      - run: bash -n ../deploy/install-cash-daily-closure-schema.sh
      - run: bash -n ../deploy/prepare-cash-daily-closure-writer.sh
      - run: bash -n ../deploy/verify-cash-daily-closures.sh
      - run: bash -n ../deploy/verify-cash-daily-closure-writer.sh
      - run: bash -n ../deploy/activate-cash-daily-closures.sh
      - run: bash -n ../deploy/disable-cash-daily-closures.sh
      - run: bash -n ../deploy/open-cash-account-window.sh
      - run: bash -n ../deploy/assign-legacy-extracto-to-numerario.sh
      - run: bash -n ../deploy/revert-legacy-extracto-numerario.sh
      - run: bash -n ../deploy/fix-legacy-extracto-rows.sh
      - run: bash -n ../deploy/delete-cash-account-movements.sh
      - run: php -l app/Http/Controllers/Api/CashPostingController.php
      - run: php tests/cash_real_posting_smoke.php
      - run: php -l app/Http/Controllers/Api/CashReportController.php
      - run: php tests/cash_report_smoke.php
      - run: php -l app/Http/Controllers/Api/CashDailyController.php
      - run: php tests/cash_daily_smoke.php
      - run: php -l app/Http/Controllers/Api/CashReversalController.php
      - run: php tests/cash_reversal_smoke.php
      - run: php -l tests/cash_reversal_mysql_rehearsal.php
      - run: bash -n ../deploy/rehearse-cash-reversals.sh
      - run: bash -n ../deploy/activate-cash-reversals.sh
      - run: bash -n ../deploy/disable-cash-reversals.sh
      - run: bash -n ../deploy/verify-cash-reversals.sh
      - run: bash -n ../deploy/audit-cash-real-movements.sh
      - run: php -l database/migrations/2026_11_17_000050_add_operation_key_to_extracto.php
      - run: php -l app/Http/Controllers/Api/CollectionScenarioPreviewController.php
      - run: php tests/collection_scenarios_smoke.php
      - run: php -l app/Http/Controllers/Api/ParcelasQuoteController.php
      - run: php tests/parcelas_quote_smoke.php
      - run: php -l app/Http/Controllers/Api/GenericSimulatorController.php
      - run: php tests/generic_simulator_smoke.php
      - run: php artisan route:list --path=api
      - name: HTTP smoke test (Laravel local)
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/cis-laravel.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/up >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/up >/dev/null || { cat /tmp/cis-laravel.log; exit 1; }
          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/auth/me)
          test "$status" = 401 || { echo "Expected auth 401, got $status"; exit 1; }

  contract-cash-mysql:
    # Ensaio REAL: pagamentos e desembolsos ligados à Caixa + histórico imutável (MySQL 8 descartável).
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cis_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: cis_ci
      DB_USERNAME: root
      DB_PASSWORD: root
      CONTRACT_WRITER_DB_HOST: 127.0.0.1
      CONTRACT_WRITER_DB_DATABASE: cis_ci
      CONTRACT_WRITER_DB_USERNAME: root
      CONTRACT_WRITER_DB_PASSWORD: root
      LEGACY_DB_HOST: 127.0.0.1
      LEGACY_DB_DATABASE: cis_ci
      LEGACY_DB_USERNAME: root
      LEGACY_DB_PASSWORD: root
      CIS_CI_CONTRACT_REHEARSAL: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, openssl, fileinfo
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php -l app/Services/CashAccountLedger.php && php -l app/Services/ContractHistory.php
      - run: php tests/contract_cash_flows_mysql_rehearsal.php
      - run: bash -n ../deploy/install-contract-history.sh && bash -n ../deploy/install-company-settings.sh && bash -n ../deploy/install-user-management.sh && bash -n ../deploy/enable-client-full-edit.sh && bash -n ../deploy/renumber-contracts.sh && bash -n ../deploy/activate-collection-operations.sh
      - run: bash -n ../deploy/activate-contract-cash-flows.sh
      - run: bash -n ../deploy/disable-contract-cash-flows.sh
      - run: bash -n ../deploy/verify-contract-cash-flows.sh
      - run: bash -n ../deploy/delete-test-borrower.sh
      - name: Every approval flag used by the API reaches the container
        run: |
          missing=0
          for f in $(grep -rhoE "CIS_[A-Z_]+_APPROVED" app routes | sort -u); do
            grep -q "^ *$f:" ../deploy/compose.preview.yaml || { echo "Flag $f não passa para o container (deploy/compose.preview.yaml)"; missing=1; }
          done
          exit $missing
  cash-repair:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, pdo_mysql
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env
      - run: sed -i '/^DB_DATABASE=/d' .env
      - run: touch database/database.sqlite
      - run: php artisan key:generate
      - run: php artisan migrate:install
      - run: php tests/create_cash_legacy_fixture.php
      - run: php tests/create_cash_repair_fixture.php
      - run: php artisan migrate --path=database/migrations/2026_11_17_000032_repair_legacy_cash_schema_to_direct_accounts.php --force
      - run: php tests/cash_smoke.php
      - run: php -l database/migrations/2026_11_17_000032_repair_legacy_cash_schema_to_direct_accounts.php
      - run: bash -n ../deploy/rehearse-cash-repair.sh
      - run: bash -n ../deploy/apply-cash-repair.sh

  streamlit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamlit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest
      - run: python -m py_compile app.py schema_validation.py
      - run: PYTHONPATH=. python -m pytest tests/test_schema_validation.py -q
      - run: python -m pip check
      - name: Streamlit headless startup smoke test
        run: |
          streamlit run app.py --server.port 8501 --server.headless true > /tmp/cis-streamlit.log 2>&1 &
          echo $! > /tmp/cis-streamlit.pid
          python - <<'PY'
          import time, urllib.request
          for _ in range(30):
              try:
                  with urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=2) as r:
                      if r.status == 200:
                          print('Streamlit health OK')
                          break
              except Exception:
                  time.sleep(1)
          else:
              print(open('/tmp/cis-streamlit.log').read())
              raise SystemExit('Streamlit did not start')
          PY
          kill "$(cat /tmp/cis-streamlit.pid)"
