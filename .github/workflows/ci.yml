name: CIS validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, pdo_mysql, openssl, fileinfo
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: php -l app/Domain/Money.php
      - run: php -l app/Domain/DistribuicaoPagamento.php
      - run: php tests/domain_smoke.php
      - run: cp .env.example .env
      - run: sed -i '/^DB_DATABASE=/d' .env
      - run: touch database/database.sqlite
      - run: php artisan key:generate
      - run: php -r 'require "vendor/autoload.php"; $app=require "bootstrap/app.php"; $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap(); if (!array_key_exists("mysql_cash_setup",config("database.connections",[]))) exit(1); echo "Cash writer connection configured.\n";'
      - run: php tests/create_cash_legacy_fixture.php
      # A migração de estratégia do legado exige Contractos real, ausente na BD SQLite de CI.
      # Validar isoladamente as novas tabelas sem modificar a migração financeira do legado.
      - name: Migrate isolated CIS schema (SQLite test DB only)
        run: |
          for migration in 2026_10_22_000001_create_cis_auth_tables.php 2026_10_22_000001_create_client_drafts_table.php 2026_10_28_000001_create_clients_table.php 2026_11_14_000010_create_cis_financial_reference_tables.php 2026_11_16_000030_create_cis_cash_tables.php; do
            php artisan migrate --path="database/migrations/$migration" --force
          done
      - run: php -l app/Http/Controllers/Api/CashController.php
      - run: php -l database/migrations/2026_11_16_000030_create_cis_cash_tables.php
      - run: bash -n ../deploy/preflight-cash-direct-account.sh
      - run: bash -n ../deploy/rehearse-cash-migration.sh
      - run: bash -n ../deploy/install-cash-direct-account.sh
      - run: bash -n ../deploy/activate-cash-account-registration.sh
      - run: bash -n ../deploy/verify-cash-account-registration.sh
      - run: bash -n ../deploy/postflight-cash-direct-account.sh
      - run: bash -n ../deploy/inspect-cash-migration-mismatch.sh
      - run: php tests/cash_smoke.php
      - run: php -l app/Http/Controllers/Api/CollectionScenarioPreviewController.php
      - run: php tests/collection_scenarios_smoke.php
      - run: php -l app/Http/Controllers/Api/ParcelasQuoteController.php
      - run: php tests/parcelas_quote_smoke.php
      - run: php artisan route:list --path=api
      - name: HTTP smoke test (Laravel local)
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/cis-laravel.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/up >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/up >/dev/null || { cat /tmp/cis-laravel.log; exit 1; }
          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/auth/me)
          test "$status" = 401 || { echo "Expected auth 401, got $status"; exit 1; }

  cash-repair:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, pdo_mysql
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env
      - run: sed -i '/^DB_DATABASE=/d' .env
      - run: touch database/database.sqlite
      - run: php artisan key:generate
      - run: php artisan migrate:install
      - run: php tests/create_cash_legacy_fixture.php
      - run: php tests/create_cash_repair_fixture.php
      - run: php artisan migrate --path=database/migrations/2026_11_17_000032_repair_legacy_cash_schema_to_direct_accounts.php --force
      - run: php tests/cash_smoke.php
      - run: php -l database/migrations/2026_11_17_000032_repair_legacy_cash_schema_to_direct_accounts.php
      - run: bash -n ../deploy/rehearse-cash-repair.sh
      - run: bash -n ../deploy/apply-cash-repair.sh

  streamlit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamlit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest
      - run: python -m py_compile app.py schema_validation.py
      - run: PYTHONPATH=. python -m pytest tests/test_schema_validation.py -q
      - run: python -m pip check
      - name: Streamlit headless startup smoke test
        run: |
          streamlit run app.py --server.port 8501 --server.headless true > /tmp/cis-streamlit.log 2>&1 &
          echo $! > /tmp/cis-streamlit.pid
          python - <<'PY'
          import time, urllib.request
          for _ in range(30):
              try:
                  with urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=2) as r:
                      if r.status == 200:
                          print('Streamlit health OK')
                          break
              except Exception:
                  time.sleep(1)
          else:
              print(open('/tmp/cis-streamlit.log').read())
              raise SystemExit('Streamlit did not start')
          PY
          kill "$(cat /tmp/cis-streamlit.pid)"
