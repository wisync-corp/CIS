# Deploy de demonstração da API CIS. Sem acesso a dados financeiros reais.
services:
  - type: web
    name: cis-api-preview
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: /bin/sh /srv/cis/docker/render-start.sh
    healthCheckPath: /up
    autoDeployTrigger: off
    envVars:
      - key: APP_NAME
        value: CIS
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /srv/cis/database/database.sqlite
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: FRONTEND_URL
        value: https://wisync-corp.github.io
      - key: CIS_FINANCIAL_TEST_APPROVED
        value: "false"
