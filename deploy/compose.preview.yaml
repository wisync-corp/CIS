# Acrescentar à mysql-only.yaml para testar React + Laravel de forma PRIVADA.
# Esta pré-visualização NÃO publica IP externo nem activa consulta financeira.
services:
  api-preview:
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: CIS
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY deve estar definida no ficheiro privado deploy/.env}
      APP_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE:-cis}
      DB_USERNAME: ${MYSQL_USER:-cis_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Falta MYSQL_PASSWORD}
      LEGACY_DB_HOST: mysql
      LEGACY_DB_PORT: "3306"
      LEGACY_DB_DATABASE: ${MYSQL_DATABASE:-cis}
      LEGACY_DB_USERNAME: ${LEGACY_DB_USERNAME:-cis_reader}
      LEGACY_DB_PASSWORD: ${LEGACY_DB_PASSWORD:?Falta LEGACY_DB_PASSWORD}
      CIS_RUN_MIGRATIONS: "false"
      CIS_FINANCIAL_TEST_APPROVED: "false"
      CIS_PRIVATE_PREVIEW: "true"
      CIS_CLIENTES_PREVIEW_APPROVED: ${CIS_CLIENTES_PREVIEW_APPROVED:-false}
      CIS_CLIENTES_EDIT_APPROVED: ${CIS_CLIENTES_EDIT_APPROVED:-false}
      CIS_CLIENTES_SECONDARY_APPROVED: ${CIS_CLIENTES_SECONDARY_APPROVED:-false}
      CIS_CONTRACTS_READ_APPROVED: ${CIS_CONTRACTS_READ_APPROVED:-false}
      CLIENT_EDITOR_DB_HOST: mysql
      CLIENT_EDITOR_DB_DATABASE: ${MYSQL_DATABASE:-cis}
      CLIENT_EDITOR_DB_USERNAME: ${CLIENT_EDITOR_DB_USERNAME:-cis_editor}
      CLIENT_EDITOR_DB_PASSWORD: ${CLIENT_EDITOR_DB_PASSWORD:-not-configured}
      CIS_LEGACY_LOGIN_ENABLED: "false"
      CIS_LEGACY_IMPORT_APPROVED: "false"
      CACHE_STORE: file
      SESSION_DRIVER: file
    networks: [private]
    # API não exposta directamente.
  web-preview:
    build:
      context: ../frontend
      dockerfile: Dockerfile.preview
    depends_on: [api-preview]
    ports:
      - "127.0.0.1:8080:8080"
    networks: [private, preview_public]
    # Apenas loopback do VPS, acessível do PC por SSH -L.

networks:
  preview_public:
    # Bridge normal para permitir publicação em loopback; a rede MySQL continua privada.

